[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "apexai-shop"
version = "0.4.0"
description = "Python client for the Shop Bot merchant API, by ApexAi."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ApexAiOfficial" }]
keywords = ["telegram", "shop", "store", "commerce", "api", "sdk", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/ApexAiOfficial/shop-sdk"
Issues = "https://github.com/ApexAiOfficial/shop-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/apexai_shop"]

[tool.hatch.build.targets.sdist]
include = ["src/apexai_shop", "contract", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src/apexai_shop", "examples", "tests/typecheck"]
